name: Tracefield

on:
  pull_request:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jh1nresh/tracefield@v1
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
