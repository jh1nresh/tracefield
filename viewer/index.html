<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Tracefield PR Impact</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app" data-ready="false">
      <header class="topbar">
        <div class="brand-block">
          <strong><span>TRACE</span>FIELD</strong>
          <code id="repository-label">loading repository…</code>
          <span class="read-only">READ-ONLY</span>
        </div>
        <div class="metrics" id="metrics" aria-label="Repository metrics"></div>
        <div class="trace-controls" aria-label="Trace controls">
          <button class="button primary" id="toggle-flow" type="button">▶ RESUME FLOW</button>
          <button class="button" id="step-flow" type="button">TRACE ONE STEP</button>
          <button class="button" id="reset-view" type="button">RESET VIEW</button>
        </div>
      </header>

      <aside class="scope-panel" aria-label="Repository scope">
        <div class="panel-heading">
          <span>REVIEW QUEUE</span>
          <button class="icon-button scope-close" id="scope-close" type="button" aria-label="Close scope panel">×</button>
        </div>
        <nav class="review-list" id="review-list" aria-label="Changed files"></nav>
        <div class="panel-heading scope-heading"><span>SCOPE</span></div>
        <label class="search-field">
          <span aria-hidden="true">⌕</span>
          <span class="sr-only">Filter modules</span>
          <input id="module-search" type="search" placeholder="Filter modules…" autocomplete="off" />
          <kbd>/</kbd>
        </label>
        <nav class="scope-list" id="scope-list"></nav>
        <footer class="commit-status" id="commit-status">CHECKING COMMIT…</footer>
      </aside>

      <main class="map-panel">
        <div class="map-heading">
          <button class="icon-button scope-open" id="scope-open" type="button" aria-label="Open scope panel">☰</button>
          <span>CODEBASE MAP</span>
          <div class="legend" aria-label="Map legend">
            <span><i class="line module"></i>Module</span>
            <span><i class="line dependency"></i>Dependency</span>
            <span><i class="line trace"></i>Active trace</span>
            <span><i class="dot"></i>Evidence</span>
          </div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <svg id="code-map" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Interactive module dependency map"></svg>
          <div class="zoom-controls" aria-label="Map zoom controls">
            <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
            <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
            <button id="fit-view" type="button" aria-label="Fit map">⌗</button>
          </div>
          <div class="trace-dock" aria-live="polite">
            <span>TRACE</span>
            <div id="trace-path"></div>
          </div>
          <p class="canvas-help">DRAG TO PAN · SCROLL TO ZOOM · CLICK A MODULE TO INSPECT</p>
        </div>
      </main>

      <aside class="inspector" id="inspector" aria-label="Module inspector">
        <header class="inspector-title">
          <div>
            <strong id="selected-name">Select a module</strong>
            <code id="selected-path">Evidence appears here</code>
          </div>
          <button class="icon-button" id="copy-path" type="button" aria-label="Copy module path">⧉</button>
        </header>
        <div class="inspector-tabs" role="tablist">
          <button role="tab" data-tab="purpose" aria-selected="true">PURPOSE</button>
          <button role="tab" data-tab="implementation" aria-selected="false">IMPLEMENTATION</button>
          <button role="tab" data-tab="evidence" aria-selected="false">EVIDENCE</button>
        </div>
        <div class="inspector-content" id="inspector-content"></div>
      </aside>
    </div>
    <noscript>This local code map requires JavaScript.</noscript>
    <script src="./data/graph.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
